<!DOCTYPE html>
<html>
  <head>
    <title>VR Orienteering Treasure Hunt</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-environment-component@1.3.2/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene joystick-controls>
      <a-assets>
        <audio id="pingSound" src="https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg" preload="auto"></audio>
      </a-assets>

      <a-entity environment="preset: neon; groundColor: #111122; grid: dashed; gridColor: #4444ff"></a-entity>

      <a-ring color="#00ffff" radius-inner="19" radius-outer="20" rotation="90 0 0" position="0 25 0" opacity="0.6">
        <a-text value="N" position="0 18 0" scale="5 5 5" align="center" color="#ff0055"></a-text>
        <a-text value="E" position="18 0 0" scale="5 5 5" align="center" color="#00ffff" rotation="0 0 -90"></a-text>
        <a-text value="S" position="0 -18 0" scale="5 5 5" align="center" color="#00ffff" rotation="0 0 180"></a-text>
        <a-text value="W" position="-18 0 0" scale="5 5 5" align="center" color="#00ffff" rotation="0 0 90"></a-text>
      </a-ring>

      <a-entity id="rig" position="0 0 0">
        <a-entity id="camera" camera look-controls wasd-controls="acceleration: 20">
          <a-cursor color="#ff0055" animation__click="property: scale; startEvents: click; from: 0.1 0.1 0.1; to: 1 1 1; dur: 150"></a-cursor>
        </a-entity>
      </a-entity>

      <a-box id="cache1" position="15 1 -5" color="#ff0055" scale="1.5 1.5 1.5"
             sound="on: click; src: #pingSound; poolSize: 2"
             animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
        <a-text value="CACHE 01\n090 DEGREE TARGET" position="0 1.2 0" scale="0.8 0.8 0.8" align="center" color="#ffffff"></a-text>
      </a-box>

      <a-cylinder position="-8 3 -12" radius="0.2" height="6" color="#00ffff"></a-cylinder>
      <a-sphere position="-8 6 -12" radius="1.5" color="#00ff00" opacity="0.7"></a-sphere>

      <a-cylinder position="8 3 -12" radius="0.2" height="6" color="#00ffff"></a-cylinder>
      <a-sphere position="8 6 -12" radius="1.5" color="#00ff00" opacity="0.7"></a-sphere>

      <a-plane position="0 2.5 -4" width="4" height="2" color="#000000" opacity="0.8">
        <a-text value="MISSION: ORIENTEERING QUEST\n\n1. Look overhead to find North.\n2. Locate Cache 1 at Bearing 090 (East).\n3. Walk over and click it to scan!" 
                align="center" color="#ffffff" scale="0.8 0.8 0.8" position="0 0 0.1"></a-text>
      </a-plane>

    </a-scene>
  </body>
</html>
